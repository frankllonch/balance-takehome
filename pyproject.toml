[project]
name = "balance-takehome"
version = "1.0.0"
description = "From a device event log to metrics, a wellbeing index, alerts and reinforcements."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The dashboard is an adapter over `balance/`, not part of the core: everything
# (CLI, tests, cron) can be computed without installing it.
dashboard = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
balance = "balance.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balance"]
