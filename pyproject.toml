[project]
name = "balance-takehome"
version = "1.0.0"
description = "Del log de eventos de un dispositivo a métricas, índice de bienestar, avisos y refuerzos."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# El dashboard es un adaptador sobre `balance/`, no parte del núcleo: se puede
# calcular todo (CLI, tests, cron) sin instalarlo.
dashboard = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
balance = "balance.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balance"]
